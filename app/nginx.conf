server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-fallback: onbekende routes naar index.html (geen 404 bij herladen)
    location /managementaccounting {
        alias /usr/share/nginx/html/managementaccounting;
        try_files $uri $uri/ /managementaccounting/index.html;
    }

    # Statische assets lang cachen
    location /managementaccounting/assets/ {
        alias /usr/share/nginx/html/managementaccounting/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
